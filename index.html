<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LOTD — Loser of the Day</title>
  <meta name="description" content="Loser of the Day — standings for a 4-player card game.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2S4 8.5 4 13.5C4 16 6 17.5 8 17.5c1.2 0 2.2-.6 2.8-1.5-.2 2-.8 3.5-2.3 4.5V21h7v-.5c-1.5-1-2.1-2.5-2.3-4.5.6.9 1.6 1.5 2.8 1.5 2 0 4-1.5 4-4C20 8.5 12 2 12 2Z"/></svg>
      </span>
      <div>
        <h1>LOTD</h1>
        <p class="tag">Loser of the Day</p>
      </div>
      <span class="spacer"></span>
      <button class="lock-btn" id="lock" aria-label="Unlock to log games">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Unlock
      </button>
    </header>

    <div class="board-bar" id="board-bar" hidden>
      <label class="sr-only" for="board">Leaderboard</label>
      <select id="board" class="board-select"></select>
      <span id="board-admin" class="board-admin"></span>
    </div>

    <main id="app" aria-live="polite"></main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
